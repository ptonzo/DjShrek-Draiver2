name: Windows test build

on:
  push:
    branches:
      - feature/in-app-driver-update-center
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Generate application icon
        shell: pwsh
        run: |
          .\\scripts\\Generate-Icon.ps1
          if (-not (Test-Path .\\assets\\DjShrek-Draiver.ico)) { throw "Application icon was not generated." }
      - name: Restore
        run: dotnet restore src/DjShrek.Draiver.App/DjShrek.Draiver.App.csproj
      - name: Publish Windows x64
        run: dotnet publish src/DjShrek.Draiver.App/DjShrek.Draiver.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/DjShrek-Draiver-win-x64
      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: DjShrek-Draiver-test-win-x64
          path: artifacts/DjShrek-Draiver-win-x64/
          if-no-files-found: error
          retention-days: 14
