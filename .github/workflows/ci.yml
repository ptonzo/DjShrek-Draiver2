name: Windows Build and Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Show SDK and project
        shell: pwsh
        run: |
          dotnet --info
          Get-Content .\src\DjShrek.Draiver.App\DjShrek.Draiver.App.csproj
      - name: Restore
        run: dotnet restore .\src\DjShrek.Draiver.App\DjShrek.Draiver.App.csproj -v minimal
      - name: Build Release with diagnostic log
        shell: pwsh
        run: |
          dotnet build .\src\DjShrek.Draiver.App\DjShrek.Draiver.App.csproj -c Release --no-restore -v normal 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish self-contained EXE
        run: dotnet publish .\src\DjShrek.Draiver.App\DjShrek.Draiver.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o .\artifacts\win-x64 -v minimal
      - name: Verify published executable
        shell: pwsh
        run: |
          $exe = ".\artifacts\win-x64\DjShrek-Draiver.exe"
          if (-not (Test-Path $exe)) { throw "Published executable not found: $exe" }
          $item = Get-Item $exe
          if ($item.Length -lt 1000000) { throw "Published executable is unexpectedly small ($($item.Length) bytes)." }
          Write-Host "EXE verified: $($item.Length) bytes"
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DjShrek-Draiver-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload test build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DjShrek-Draiver-Windows-x64
          path: .\artifacts\win-x64\
          if-no-files-found: error
          retention-days: 14
