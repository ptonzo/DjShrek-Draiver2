name: Windows Build and Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Generate application and installer icon
        shell: pwsh
        run: |
          .\scripts\Generate-Icon.ps1
          if (-not (Test-Path .\assets\DjShrek-Draiver.ico)) { throw "Application icon was not generated." }
      - name: Validate XAML events, installer license, and assets
        shell: pwsh
        run: .\scripts\Validate-Project.ps1
      - name: Show SDK and project
        shell: pwsh
        run: |
          dotnet --info
          Get-Content .\src\DjShrek.Draiver.App\DjShrek.Draiver.App.csproj
      - name: Restore
        run: dotnet restore .\src\DjShrek.Draiver.App\DjShrek.Draiver.App.csproj -v minimal
      - name: Build Release with diagnostic log
        shell: pwsh
        run: |
          dotnet build .\src\DjShrek.Draiver.App\DjShrek.Draiver.App.csproj -c Release --no-restore -v normal 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run WPF UI smoke test
        shell: pwsh
        run: |
          dotnet run --project .\src\DjShrek.Draiver.App\DjShrek.Draiver.App.csproj -c Release --no-build -- --self-test
          if ($LASTEXITCODE -ne 0) { throw "WPF UI smoke test failed." }
      - name: Upload Windows integration self-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DjShrek-Draiver-self-test-log
          path: ${{ runner.temp }}\\DjShrek-Draiver-self-test.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish self-contained EXE
        run: dotnet publish .\src\DjShrek.Draiver.App\DjShrek.Draiver.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o .\artifacts\win-x64 -v minimal
      - name: Verify and prepare portable package
        shell: pwsh
        run: |
          $exe = ".\artifacts\win-x64\DjShrek-Draiver.exe"
          if (-not (Test-Path $exe)) { throw "Published executable not found: $exe" }
          $item = Get-Item $exe
          if ($item.Length -lt 1000000) { throw "Published executable is unexpectedly small ($($item.Length) bytes)." }
          Remove-Item .\artifacts\win-x64\*.pdb -Force -ErrorAction SilentlyContinue
          Copy-Item .\README.md .\artifacts\win-x64\README.txt
          Copy-Item .\LICENSE-TERMS-RU.txt .\artifacts\win-x64\LICENSE-TERMS-RU.txt
          Write-Host "EXE verified: $($item.Length) bytes"
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $programFilesX86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $iscc = Join-Path $programFilesX86 "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = Join-Path $env:ProgramFiles "Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler ISCC.exe not found." }
          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Compile installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .\artifacts\installer | Out-Null
          & $env:ISCC_PATH .\installer\DjShrek-Draiver.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = ".\artifacts\installer\DjShrek-Draiver-Cyber-Club-Setup-x64.exe"
          if (-not (Test-Path $setup)) { throw "Installer was not created." }
          if ((Get-Item $setup).Length -lt 10000000) { throw "Installer is unexpectedly small." }
          Write-Host "Installer verified: $((Get-Item $setup).Length) bytes"
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DjShrek-Draiver-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload portable Windows x64 build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DjShrek-Draiver-Windows-x64
          path: .\artifacts\win-x64\
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DjShrek-Draiver-Setup-Windows-x64
          path: .\artifacts\installer\DjShrek-Draiver-Cyber-Club-Setup-x64.exe
          if-no-files-found: error
          retention-days: 14